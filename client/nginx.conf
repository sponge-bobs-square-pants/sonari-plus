# Container nginx — serves the built SPA. (The HOST nginx terminates SSL and
# reverse-proxies the domain to this container; this one just serves files.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Fingerprinted build assets never change — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html so client-side routing
    # (/shop, /account, /product/:id …) works on refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
